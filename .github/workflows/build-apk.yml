name: Build Battery Guard APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in the repository root."
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -print -quit)")
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app project not found."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" BatteryGuard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryGuard-APK
          path: BatteryGuard.apk
          if-no-files-found: error
